version: '3'
services:
  redis-4:
    image: redis:latest
    container_name: redis-4
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --appendonly yes
                   --port 6379
                   --cluster-announce-ip 172.25.5.30
                   --cluster-announce-port 6379
                   --cluster-announce-bus-port 16379
    volumes:
      - ./data4:/data
    network_mode: host

  redis-5:
    image: redis:latest
    container_name: redis-5
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: >
      redis-server --cluster-enabled yes
                   --cluster-config-file nodes.conf
                   --appendonly yes
                   --port 6380
                   --cluster-announce-ip 172.25.5.30
                   --cluster-announce-port 6380
                   --cluster-announce-bus-port 16380
    volumes:
      - ./data5:/data
    network_mode: host

  redis-6:
